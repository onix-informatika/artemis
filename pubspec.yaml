name: artemis
version: 7.13.1

description: Build dart types from GraphQL schemas and queries (using Introspection Query).
homepage: https://github.com/comigor/artemis

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  analyzer: ^8.1.1
  build: ^4.0.0
  build_config: ^1.2.0
  code_builder: ^4.11.0
  collection: ^1.19.1
  dart_style: ^3.1.2
  equatable: ^2.0.7
  glob: ^2.1.3
  gql: ^1.0.0
  gql_code_builder: ^0.15.1
  gql_dedupe_link: ^2.0.3
  gql_exec: ^1.0.0
  gql_http_link: ^1.0.0
  gql_link: ^1.0.0
  http: ^1.6.0
  json_annotation: ^4.9.0
  path: ^1.9.1
  source_gen: ">=1.5.0 <5.0.0"
  yaml: ^3.1.3

dev_dependencies:
  args: ^2.5.0
  build_resolvers: ^3.0.4
  build_runner: ^2.7.2
  build_test: ^3.3.4
  json_serializable: ^6.11.2
  lints: ^6.0.0
  logging: ^1.3.0
  test: ^1.28.0
